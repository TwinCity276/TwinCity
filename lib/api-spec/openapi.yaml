openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: incidents
    description: Civic incident reporting and triage
  - name: departments
    description: Department directory and queues
  - name: admin
    description: Protected platform administration
  - name: storage
    description: Evidence upload helpers
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /departments:
    get:
      operationId: listDepartments
      tags: [departments]
      summary: List service departments
      responses:
        "200":
          description: Departments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Department"
  /incidents:
    get:
      operationId: listIncidents
      tags: [incidents]
      summary: List reported incidents
      parameters:
        - name: department
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: mine
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Incidents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Incident"
    post:
      operationId: createIncident
      tags: [incidents]
      summary: Report a civic incident
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentInput"
      responses:
        "201":
          description: Incident created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
  /incidents/{id}:
    patch:
      operationId: updateIncident
      tags: [incidents]
      summary: Update incident status or assignment
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentUpdate"
      responses:
        "200":
          description: Incident updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [departments]
      summary: Get dashboard metrics
      parameters:
        - name: department
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /admin/settings:
    get:
      operationId: getAdminSettings
      tags: [admin]
      summary: Read editable site settings
      responses:
        "200":
          description: Site settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
    patch:
      operationId: updateAdminSettings
      tags: [admin]
      summary: Update editable site settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteSettingsUpdate"
      responses:
        "200":
          description: Site settings updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
  /admin/admins:
    get:
      operationId: listAdmins
      tags: [admin]
      summary: List dashboard administrators
      responses:
        "200":
          description: Administrators
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminAccess"
    post:
      operationId: createAdmin
      tags: [admin]
      summary: Add a dashboard administrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminAccessInput"
      responses:
        "201":
          description: Administrator added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccess"
  /admin/admins/{id}:
    delete:
      operationId: deleteAdmin
      tags: [admin]
      summary: Remove dashboard access
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Administrator removed
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a private evidence upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadRequest"
      responses:
        "200":
          description: Signed upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
components:
  parameters:
    IncidentId:
      name: id
      in: path
      required: true
      schema:
        type: integer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Department:
      type: object
      required: [id, name, shortName, description, color]
      properties:
        id: { type: string }
        name: { type: string }
        shortName: { type: string }
        description: { type: string }
        color: { type: string }
    Incident:
      type: object
      required: [id, title, description, location, department, status, priority, reportedAt, reporter]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        location: { type: string }
        department: { type: string }
        status: { type: string }
        priority: { type: string }
        evidenceUrl: { type: ["string", "null"] }
        reportedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        reporter: { type: string }
        assignedTo: { type: ["string", "null"] }
    IncidentInput:
      type: object
      required: [title, description, location, department, priority, reporter]
      properties:
        title: { type: string, minLength: 2 }
        description: { type: string, minLength: 2 }
        location: { type: string, minLength: 2 }
        department: { type: string }
        priority: { type: string }
        evidenceUrl: { type: ["string", "null"] }
        reporter: { type: string }
    IncidentUpdate:
      type: object
      properties:
        status: { type: string }
        priority: { type: string }
        assignedTo: { type: ["string", "null"] }
    DashboardSummary:
      type: object
      required: [total, newCount, inProgress, resolved, averageResponseHours, trend]
      properties:
        total: { type: integer }
        newCount: { type: integer }
        inProgress: { type: integer }
        resolved: { type: integer }
        averageResponseHours: { type: number }
        trend:
          type: array
          items:
            $ref: "#/components/schemas/TrendPoint"
    TrendPoint:
      type: object
      required: [label, count]
      properties:
        label: { type: string }
        count: { type: integer }
    SiteSettings:
      type: object
      required: [siteName, tagline, welcomeMessage, currentYear]
      properties:
        siteName: { type: string }
        tagline: { type: string }
        welcomeMessage: { type: string }
        currentYear: { type: integer }
    SiteSettingsUpdate:
      type: object
      properties:
        siteName: { type: string }
        tagline: { type: string }
        welcomeMessage: { type: string }
    AdminAccess:
      type: object
      required: [id, email, role, department, createdAt]
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        role: { type: string }
        department: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    AdminAccessInput:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { type: string }
        department: { type: ["string", "null"] }
    UploadRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string }
        size: { type: integer }
        contentType: { type: string }
    UploadResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string }
        objectPath: { type: string }

